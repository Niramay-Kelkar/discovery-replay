services:
  target_app:
    build: .
    command: >
      sh -c "python target_app/seed.py &&
             flask --app target_app.app run --host=0.0.0.0 --port 5001"
    ports:
      - "5001:5001"

  operator_console:
    build: .
    command: python -m agent.operator_console --host 0.0.0.0 --port 5002
    ports:
      - "5002:5002"
    volumes:
      - .:/app
